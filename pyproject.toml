[project]
name = "home-swe-home"
version = "0.2.0"
description = "A small coding agent built on the anima micro-kernel, over the NVIDIA API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=3,<4",
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "anima @ git+https://github.com/magitech-ai/anima.git",
    "google-genai>=3.6.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "pytest-asyncio>=1.4", "mypy>=1.11", "ruff>=0.17"]

[project.scripts]
home-swe-home = "home_swe_home.cli:main"
hsh = "home_swe_home.cli:main"
hsh-review = "home_swe_home.review:main"
hsh-review-eval = "home_swe_home.review_eval:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_swe_home = ["py.typed", "harness/*.md", "review_cases.json"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
python_files = ["*.py"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/home_swe_home"]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]

[tool.coverage.report]
fail_under = 100
