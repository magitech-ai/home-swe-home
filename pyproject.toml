[project]
name = "home-swe-home"
version = "0.3.0"
description = "A small coding agent built on the animas micro-kernel and magitech-harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "tiktoken>=0.8",
    "animas",
    "magitech-harness",
    "mth-plugins",
    "google-genai>=3.6.1",
    "openai>=3,<4",
]

[tool.uv.sources]
animas = { git = "https://github.com/magitech-ai/animas.git" }
magitech-harness = { git = "https://github.com/magitech-ai/magitech-harness.git" }
# Git source so home-swe-home resolves in clean CI checkouts (no sibling
# clone needed). The OKF + Skills consumption components and the canonical
# dev_tools.repo_map module must be merged to mth-plugins main before this
# resolves to a version that provides them.
mth-plugins = { git = "https://github.com/magitech-ai/mth-plugins.git" }

# magitech-harness pins animas with a repo-relative path (../animas) and
# mth-plugins pins both animas and magitech-harness with repo-relative paths;
# none resolve when installed from git. All are declared here and forced for
# every consumer so the git sources win in clean checkouts.
[tool.uv]
override-dependencies = ["animas", "magitech-harness"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=6.0", "pytest-asyncio>=1.4", "mypy>=1.11", "ruff>=0.17"]

[project.scripts]
home-swe-home = "home_swe_home.cli:main"
hsh = "home_swe_home.cli:main"
hsh-review = "home_swe_home.review:main"
hsh-review-eval = "home_swe_home.review_eval:main"
hsh-audit = "home_swe_home.audit:main"
hsh-gate = "home_swe_home.gate:main"
hsh-improve = "home_swe_home.improve_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
home_swe_home = ["py.typed", "harness/*.md", "review_cases.json"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
python_files = ["*.py"]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src/home_swe_home"]
branch = true
omit = [
    "*/temp/*",
    "*/AppData/Local/Temp/**",
]

[tool.coverage.report]
fail_under = 100
