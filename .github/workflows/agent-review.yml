name: Agent review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  review:
    name: Agent review
    runs-on: ubuntu-latest
    environment: agent-review
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL || 'nvidia/nemotron-3.5-super-vl:free' }}
      REVIEWER_PROVIDER: openrouter
      PR: ${{ github.event.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Checkout shared OKF knowledge bundles
        uses: actions/checkout@v5
        with:
          repository: magitech-ai/agents-home
          token: ${{ secrets.AGENTS_HOME_TOKEN }}
          path: agents-home

      - name: Check kill switch
        env:
          HOME_SWE_HOME_REVIEW_ENABLED: ${{ vars.AGENT_REVIEW_ENABLED }}
        run: PYTHONPATH=src python3 -m home_swe_home.gate

      - uses: astral-sh/setup-uv@v7
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev

      - name: Collect review inputs
        run: |
          set -euo pipefail
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" > diff.txt
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json body,labels --jq '{body: .body, labels: [.labels[].name]}' > pr-meta.json
          jq -r .body pr-meta.json > pr-body.txt
          LABELS=$(jq -r '.labels | join(",")' pr-meta.json)
          if [[ ",$LABELS," == *",auto-revert,"* ]]; then
            printf '%s\n' "Done when: this PR reverts exactly the commit named in its body, does not auto-merge, and preserves the auto-revert label." > spec.txt
            ISSUE=0
            AUTHOR_MODEL=auto-revert
          else
            ISSUE=$(sed -n 's/.*Trigger issue: *#\?\([0-9][0-9]*\).*/\1/p' pr-body.txt | head -1)
            AUTHOR_MODEL=$(sed -n 's/.*Author model: *//p' pr-body.txt | head -1 | tr -d '\r' | xargs)
            if [ -z "${ISSUE}" ] || [ -z "${AUTHOR_MODEL}" ]; then
              echo "PR body must record 'Trigger issue: #N' and 'Author model: <id>'" >&2
              exit 2
            fi
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --json body --jq .body > spec.txt
          fi
          echo "ISSUE=${ISSUE}" >> "$GITHUB_ENV"
          echo "AUTHOR_MODEL=${AUTHOR_MODEL}" >> "$GITHUB_ENV"

          # A marked author comment is passed as an untrusted claim, never as
          # authority. Without this, rebuttals are invisible to the reviewer.
          DISPUTE=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.body | contains("<!-- review-dispute -->"))] | last | .body // empty')
          if [ -n "$DISPUTE" ]; then
            printf '%s\n' "$DISPUTE" > dispute.txt
            echo "DISPUTE_PRESENT=1" >> "$GITHUB_ENV"
          else
            : > dispute.txt
          fi

          # Host-generated check rollup: verifiable data, unlike the PR body.
          # `bucket` is the pass/fail/pending field; `conclusion` is not a
          # supported --json field on `gh pr checks`.
          # A non-zero exit means a check is pending/failing (the Agent review
          # check itself is pending here), not that the fetch failed. Keep the
          # captured output; only fall back for a genuinely empty file.
          gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" \
            --json name,state,bucket,link,workflow,completedAt > checks.json || true
          if [ ! -s checks.json ]; then
            echo '[]' > checks.json
          fi

      - name: Run independent reviewer
        id: review
        run: |
          set +e
          uv run hsh-review \
            --diff diff.txt \
            --spec spec.txt \
            --standard AGENTS=AGENTS.md \
            --standard REVIEW=docs/agents/review-standard.md \
            --standard TRIAGE=docs/agents/triage-labels.md \
            --okf-bundle CODING=agents-home/knowledge/coding-standards \
            --okf-bundle ENGINEERING=agents-home/knowledge/engineering-standards \
            --okf-bundle FACTORY=agents-home/knowledge/factory-contract \
            --author-provider gemini \
            --author-model "$AUTHOR_MODEL" \
            --reviewer-provider "$REVIEWER_PROVIDER" \
            --reviewer-model "$REVIEWER_MODEL" \
            --dispute dispute.txt \
            --claims pr-body.txt \
            --checks checks.json \
            --out verdict.json > review-output.txt 2> review-error.txt
          CODE=$?
          set -e
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          ref: audit
          path: audit-checkout
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write audit record
        id: audit
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          FILENAME="$(date -u +%Y-%m-%dT%H%M%SZ)-pr${PR}-${HEAD_SHA:0:8}.json"
          if [ -f verdict.json ]; then
            jq '.evidence_check // []' verdict.json > evidence-check.json
          else
            echo '[]' > evidence-check.json
          fi
          uv run hsh-audit \
            --verdict verdict.json \
            --error-file review-error.txt \
            --out audit-record.json \
            --pr "$PR" \
            --commit "$HEAD_SHA" \
            --trigger-issue "$ISSUE" \
            --author-model "$AUTHOR_MODEL" \
            --reviewer-model "$REVIEWER_MODEL" \
            --reviewer-provider "$REVIEWER_PROVIDER" \
            --run-id "$RUN_ID" \
            --recorded-at "$NOW" \
            --evidence-check evidence-check.json
          mkdir -p audit-checkout/reviews
          cp audit-record.json "audit-checkout/reviews/$FILENAME"
          cd audit-checkout
          git config user.name "home-swe-home audit"
          git config user.email "audit@users.noreply.github.com"
          git add "reviews/$FILENAME"
          git commit -m "audit: review of PR #$PR"
          for i in 1 2 3; do
            git push origin audit && break
            git fetch origin audit
            git rebase origin/audit
          done
          echo "path=reviews/$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Post verdict comment
        run: |
          set -euo pipefail
          {
            echo '<!-- agent-review verdict -->'
            cat review-output.txt
            echo
            echo "Audit record: \`${{ steps.audit.outputs.path }}\` on the \`audit\` branch."
          } > comment.txt
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.txt

      - name: Enforce verdict
        env:
          CODE: ${{ steps.review.outputs.code }}
        run: |
          if [ "$CODE" -ne 0 ]; then
            echo "Independent reviewer did not approve (exit $CODE)." >&2
            exit 1
          fi
