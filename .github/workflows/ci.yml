name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    uses: magitech-ai/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.12"
      # dev tools (pytest, mypy, ruff, pytest-asyncio) are optional extras
      install-command: "uv sync --extra dev"
      # magecode's pytest config has no coverage addopts; pass them here so
      # the reusable workflow's coverage-report step has data to check
      test-commands: "uv run pytest --cov=src/magecode --cov-branch --cov-fail-under=100"
      coverage-floor: 100
